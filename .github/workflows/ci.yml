name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      #################################################
      # Install Backend
      #################################################

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      #################################################
      # Install Frontend
      #################################################

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      #################################################
      # Backend Lint
      #################################################

      - name: Lint Backend
        working-directory: backend
        run: npm run lint --if-present

      #################################################
      # Frontend Lint
      #################################################

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint --if-present

      #################################################
      # Backend Tests
      #################################################

      - name: Run Backend Tests
        working-directory: backend
        run: npm test --if-present

      #################################################
      # Frontend Tests
      #################################################

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test --if-present

      #################################################
      # Build Frontend
      #################################################

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      #################################################
      # Verify Backend Loads
      #################################################

      - name: Verify Backend Startup
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/hostelkart_ci_test
          JWT_SECRET: ci_test_jwt_secret_12345
        run: |
          node -e "
          import('./server.js')
            .then(() => {
              console.log('✅ Backend verified successfully');
              setTimeout(() => process.exit(0), 1500);
            })
            .catch((err) => {
              console.error(err);
              process.exit(1);
            });
          "
